[package]
name = "ingestor"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-serial = "5.5"
clap = { version = "4.6", features = ["derive", "env"] }
protocol = { workspace = true, features = ["std"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "macros", "migrate"] }
chrono = "0.4"
