[workspace]

[package]
authors = ["Samuel Spinn <sspinn@netfeasa.com>"]
name = "firmware"
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "firmware"
test = false
bench = false

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "stm32f303vc",
    "unstable-pac",
    "memory-x",
    "time-driver-tim2",
    "exti",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7.6", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
heapless = { version = "0.9", default-features = false }
static_cell = "2"
# -- IMU filter ---
ahrs = { version = "0.8", default-features = false }
nalgebra = { version = "0.34.2", default-features = false }
# -- messaging protocol --
protocol = { path = "../protocol", features = ["defmt"] }

[dev-dependencies]
defmt-test = "0.3"

[[test]]
name = "integration"
harness = false

[profile.release]
debug = 2
opt-level = "s"

[package.metadata.embassy]
build = [
    { target = "thumbv7em-none-eabihf", artifact-dir = "out/examples/stm32f3" },
]

[package.metadata.cargo-machete]
ignored = ["cortex-m", "cortex-m-rt"]