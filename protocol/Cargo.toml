[package]
name = "protocol"
version = "0.1.0"
edition = "2021"          # changed from 2024 (Rust 2024 is still unstable)
license = "MIT OR Apache-2.0"

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = [
    "experimental-derive",
    "use-crc"
]}
heapless = { version = "0.9", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
cobs = { version = "0.5", default-features = false }
defmt = { version = "0.3", optional = true}   # for firmware logging

[features]
default = ["alloc"]                     # ingestor gets alloc for free
alloc = ["cobs/alloc"]                  # only pulls in Vec support when needed
defmt = ["dep:defmt"]