version: "3"

tasks:
  build:firmware:
    dir: firmware
    cmds:
      - cargo build --release

  flash:firmware:
    dir: firmware
    cmds:
      - cargo run --release

  build:ingestor:
    cmds:
      - cargo build --package ingestor

  build:
    deps: [build:firmware, build:ingestor]

  test:firmware:
    dir: firmware
    cmds:
      - cargo test --test integration

  check:protocol:
    cmds:
      - cargo check -p protocol --no-default-features --target thumbv7em-none-eabihf

  test:e2e:
    cmds:
      - cargo test --package ingestor -- --ignored

  test:
    deps: [test:firmware]

  check:
    deps: [check:protocol]
