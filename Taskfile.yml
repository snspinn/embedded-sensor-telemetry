version: "3"

env:
  DATABASE_URL: postgres://telemetry:telemetry@localhost:5433/telemetry

tasks:
  db:up:
    cmds:
      - docker compose up -d --wait db

  build:firmware:
    dir: firmware
    cmds:
      - cargo build --release

  flash:firmware:
    dir: firmware
    cmds:
      - cargo run --release

  build:ingestor:
    cmds:
      - cargo build --package ingestor

  build:
    deps: [build:firmware, build:ingestor]

  test:firmware:
    dir: firmware
    cmds:
      - cargo test --test integration

  check:protocol:
    cmds:
      - cargo check -p protocol --no-default-features --target thumbv7em-none-eabihf

  test:db:
    deps: [db:up]
    cmds:
      - "cargo test --package ingestor -- --ignored store:: api::"

  test:e2e:
    deps: [db:up]
    cmds:
      - cargo test --package ingestor -- --ignored

  test:
    deps: [test:firmware]

  check:
    deps: [check:protocol]
